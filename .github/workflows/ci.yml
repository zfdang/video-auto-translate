name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-scripts:
    name: Test Release Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script tests
        run: |
          python3 scripts/test-release-metadata.py
          python3 scripts/test-release-notes.py

  build-and-test:
    name: Build & Test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: version
        run: |
          scripts/release-metadata.sh | tee "$RUNNER_TEMP/release-version"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_ENV"

      - name: Test release scripts
        run: |
          python3 scripts/test-release-metadata.py
          python3 scripts/test-release-notes.py

      - name: Swift Test
        run: swift test

      - name: Build macOS App
        run: ./build_app.sh

      - name: Package Release
        run: ./scripts/package-release.sh

      - name: Verify build artifacts
        run: |
          test -d "dist/VideoAutoTranslate.app"
          test -f "dist/VideoAutoTranslate.app/Contents/MacOS/VideoAutoTranslate"
          test -f "dist/release/VideoAutoTranslate_${RELEASE_TAG}_macOS_arm64.dmg"
          test -f "dist/release/VideoAutoTranslate_${RELEASE_TAG}_macOS_arm64.zip"
          test -f "dist/release/SHA256SUMS.txt"

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoAutoTranslate-CI-${{ github.sha }}
          path: dist/release/*
          retention-days: 7
