name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-scripts:
    name: Test Release Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run script tests
        run: |
          python3 scripts/test-release-metadata.py
          python3 scripts/test-release-notes.py

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/test-asr-results.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Test ASR timing contract
        run: |
          python3 -m venv "$RUNNER_TEMP/asr-test"
          "$RUNNER_TEMP/asr-test/bin/python" -m pip install fastapi==0.151.0 uvicorn==0.54.0 python-multipart==0.0.32
          "$RUNNER_TEMP/asr-test/bin/python" scripts/test-asr-results.py

  build-and-test:
    name: Build & Test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift Test
        run: swift test
